workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 21
      vars:
        NODE_VERSION: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync assets and plugins to Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
